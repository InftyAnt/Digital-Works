<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Digital Works Prototype</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="digital-works-app">
      <!-- Top-level commands that affect the whole circuit or viewport. -->
      <header class="topbar">
        <div>
          <h1>Digital Works Prototype</h1>
          <p>Grid-snapped logic editor with orthogonal wires</p>
        </div>
        <div class="top-actions">
          <button id="reset-view" type="button">Reset View</button>
          <button id="reset-simulation" type="button">Reset Sim</button>
          <button id="settings-open" type="button">Settings</button>
          <button id="clear-circuit" type="button">Clear</button>
          <button id="save-file" type="button">Save File</button>
          <button id="save-file-as" type="button">Save File As</button>
          <label id="load-file-button" class="import-button">
            Load File
            <input id="load-file" type="file" accept="application/json,.json" />
          </label>
        </div>
      </header>

      <!-- Compact icon toolbar for modes, parts, gates, and macro imports. -->
      <nav class="palette" aria-label="Component palette">
        <div class="toolbar-group" aria-label="Modes">
          <button type="button" data-tool="move" class="tool icon-button active" title="Move" aria-label="Move">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4l7 16 2-7 7-2z"/></svg>
            <span class="sr-only">Move</span>
          </button>
          <button type="button" data-tool="control" class="tool icon-button" title="Control" aria-label="Control">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
            <span class="sr-only">Control</span>
          </button>
          <button type="button" data-tool="wire" class="tool icon-button" title="Wire" aria-label="Wire">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h7v12h9"/><circle cx="4" cy="6" r="2"/><circle cx="20" cy="18" r="2"/></svg>
            <span class="sr-only">Wire</span>
          </button>
          <button id="simulation-run-toggle" type="button" class="icon-button" title="Run Simulation" aria-label="Run Simulation" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path class="run-icon" d="M8 5v14l11-7z"/><path class="stop-icon" d="M7 7h10v10H7z"/></svg>
            <span class="sr-only">Run Simulation</span>
          </button>
        </div>

        <div class="toolbar-group part-group" aria-label="Input">
          <button type="button" data-add="INPUT" class="icon-button" title="Input Switch" aria-label="Input Switch">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="3"/><circle cx="12" cy="12" r="4"/></svg>
            <span class="sr-only">Input Switch</span>
          </button>
          <button type="button" data-add="MULTI_INPUT" class="icon-button" title="Multi-bit Switch" aria-label="Multi-bit Switch">
            <svg viewBox="0 0 32 24" aria-hidden="true"><rect x="3" y="6" width="26" height="10"/><circle cx="8" cy="11" r="2.2"/><circle cx="14" cy="11" r="2.2"/><circle cx="20" cy="11" r="2.2"/><circle cx="26" cy="11" r="2.2"/><path d="M8 16v5M14 16v5M20 16v5M26 16v5"/></svg>
            <span class="sr-only">Multi-bit Switch</span>
          </button>
          <button type="button" data-add="CABLE_SWITCH" class="icon-button" title="Cable Switch" aria-label="Cable Switch">
            <svg viewBox="0 0 32 24" aria-hidden="true"><rect x="6" y="3" width="20" height="12" rx="1" fill="none"/><path d="M16 15v7" stroke="currentColor" stroke-width="5" stroke-linecap="butt"/></svg>
            <span class="sr-only">Cable Switch</span>
          </button>
        </div>

        <div class="toolbar-group part-group" aria-label="Test">
          <button type="button" data-add="TEST_INPUT" class="icon-button" title="Test Switch" aria-label="Test Switch">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 9-9 9-9-9z"/><circle cx="12" cy="12" r="3"/></svg>
            <span class="sr-only">Test Switch</span>
          </button>
          <button type="button" data-add="MULTI_TEST_INPUT" class="icon-button" title="Multi-bit Test Switch" aria-label="Multi-bit Test Switch">
            <svg viewBox="0 0 32 24" aria-hidden="true"><path d="M2 11l4-5h20l4 5-4 5H6z"/><circle cx="8" cy="11" r="2.2"/><circle cx="14" cy="11" r="2.2"/><circle cx="20" cy="11" r="2.2"/><circle cx="26" cy="11" r="2.2"/><path d="M8 16v5M14 16v5M20 16v5M26 16v5"/></svg>
            <span class="sr-only">Multi-bit Test Switch</span>
          </button>
          <button type="button" data-add="CABLE_TEST_SWITCH" class="icon-button" title="Cable Test Switch" aria-label="Cable Test Switch">
            <svg viewBox="0 0 32 24" aria-hidden="true"><path d="M5 9l4-6h14l4 6-4 6H9z" fill="none"/><path d="M16 15v7" stroke="currentColor" stroke-width="5" stroke-linecap="butt"/></svg>
            <span class="sr-only">Cable Test Switch</span>
          </button>
        </div>

        <div class="toolbar-group part-group" aria-label="Output">
          <button type="button" data-add="OUTPUT" class="icon-button" title="LED Output" aria-label="LED Output">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/></svg>
            <span class="sr-only">LED Output</span>
          </button>
          <button type="button" data-add="MULTI_OUTPUT" class="icon-button" title="Multi-bit LED Output" aria-label="Multi-bit LED Output">
            <svg viewBox="0 0 32 24" aria-hidden="true"><circle cx="6" cy="12" r="4"/><circle cx="13" cy="12" r="4"/><circle cx="20" cy="12" r="4"/><circle cx="27" cy="12" r="4"/></svg>
            <span class="sr-only">Multi-bit LED Output</span>
          </button>
          <button type="button" data-add="CABLE_OUTPUT" class="icon-button" title="Cable Output" aria-label="Cable Output">
            <svg viewBox="0 0 32 24" aria-hidden="true"><path d="M13 3h6a7 7 0 0 1 0 14h-6a7 7 0 0 1 0-14z" fill="none"/><rect x="13.5" y="17" width="5" height="6" fill="currentColor" stroke="none"/></svg>
            <span class="sr-only">Cable Output</span>
          </button>
        </div>

        <div class="toolbar-group part-group" aria-label="Pin">
          <button type="button" data-add="PIN" class="icon-button" title="Pin" aria-label="Pin">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="8" height="8"/></svg>
            <span class="sr-only">Pin</span>
          </button>
          <button type="button" data-add="MULTI_PIN" class="icon-button" title="Multi-bit Pin" aria-label="Multi-bit Pin">
            <svg viewBox="0 0 32 24" aria-hidden="true"><rect x="3" y="8" width="5" height="5"/><rect x="11" y="8" width="5" height="5"/><rect x="19" y="8" width="5" height="5"/><rect x="27" y="8" width="5" height="5"/></svg>
            <span class="sr-only">Multi-bit Pin</span>
          </button>
          <button type="button" data-add="CABLE_PIN" class="icon-button" title="Cable Pin" aria-label="Cable Pin">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="4" width="6" height="16" fill="none"/><circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/></svg>
            <span class="sr-only">Cable Pin</span>
          </button>
        </div>

        <div class="toolbar-group part-group" aria-label="Pin Combinations">
          <button type="button" data-add="TEST_INPUT_STUB" class="icon-button" title="Pin + Test Switch" aria-label="Pin + Test Switch">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="15" width="6" height="6"/><path d="M9 18h6v-6"/><path d="M15 2l5 5-5 5-5-5z"/></svg>
            <span class="sr-only">Pin + Test Switch</span>
          </button>
          <button type="button" data-add="TEST_OUTPUT_STUB" class="icon-button" title="Pin + LED Output" aria-label="Pin + LED Output">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="6.5" r="4.5"/><path d="M8 11v6h7"/><rect x="15" y="14" width="6" height="6"/></svg>
            <span class="sr-only">Pin + LED Output</span>
          </button>
          <button type="button" data-add="CABLE_TEST_INPUT_STUB" class="icon-button" title="Cable Pin + Cable Test Switch" aria-label="Cable Pin + Cable Test Switch">
            <svg viewBox="0 0 32 24" aria-hidden="true"><rect x="3" y="14" width="4" height="8" fill="none"/><path d="M7 18h9v-7" stroke-width="4" stroke-linecap="butt"/><path d="M12 1.5h8l4 4.75-4 4.75h-8l-4-4.75z" fill="none"/></svg>
            <span class="sr-only">Cable Pin + Cable Test Switch</span>
          </button>
          <button type="button" data-add="CABLE_OUTPUT_STUB" class="icon-button" title="Cable Pin + Cable Output" aria-label="Cable Pin + Cable Output">
            <svg viewBox="0 0 32 24" aria-hidden="true"><path d="M14 11v7h9" stroke-width="4" stroke-linecap="butt"/><path d="M10 1.5h8a4.75 4.75 0 0 1 0 9.5h-8a4.75 4.75 0 0 1 0-9.5z" fill="none"/><rect x="23" y="14" width="4" height="8" fill="none"/></svg>
            <span class="sr-only">Cable Pin + Cable Output</span>
          </button>
        </div>

        <div class="toolbar-group part-group" aria-label="Power">
          <button type="button" data-add="VCC" class="icon-button" title="VCC" aria-label="VCC">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9h14M12 9v6"/></svg>
            <span class="sr-only">VCC</span>
          </button>
          <button type="button" data-add="GND" class="icon-button" title="GND" aria-label="GND">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v8M5 13h14M8 17h8M10 21h4"/></svg>
            <span class="sr-only">GND</span>
          </button>
          <button type="button" data-add="X_SRC" class="icon-button" title="X Source" aria-label="X Source">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7"/></svg>
            <span class="sr-only">X Source</span>
          </button>
          <button type="button" data-add="Z_SRC" class="icon-button" title="Z Source" aria-label="Z Source">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M8 8h8l-8 8h8"/></svg>
            <span class="sr-only">Z Source</span>
          </button>
          <button type="button" data-add="CLOCK" class="icon-button" title="Clock" aria-label="Clock">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M5.5 13h4V8h5v5h4"/></svg>
            <span class="sr-only">Clock</span>
          </button>
          <button type="button" data-add="PULSE" class="icon-button" title="Pulse Maker" aria-label="Pulse Maker">
            <svg viewBox="0 0 32 24" aria-hidden="true"><rect x="4" y="5" width="24" height="14"/><path d="M7 14h5V9h4v5h4V9h5"/></svg>
            <span class="sr-only">Pulse Maker</span>
          </button>
        </div>

        <div class="toolbar-group part-group" aria-label="Text">
          <button type="button" data-add="TEXT" class="icon-button" title="Text" aria-label="Text">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M12 6v13M8 19h8"/></svg>
            <span class="sr-only">Text</span>
          </button>
        </div>

        <div class="toolbar-group part-group" aria-label="Bus and Cable">
          <button type="button" data-add="BUS" class="icon-button" title="Bus" aria-label="Bus">
            <svg viewBox="0 0 32 24" aria-hidden="true"><path d="M6 3v18h22M11 3v14h17M16 3v10h12M21 3v6h7"/></svg>
            <span class="sr-only">Bus</span>
          </button>
          <button type="button" data-add="CABLE_TO_BUS" class="icon-button" title="Cable to Bus" aria-label="Cable to Bus">
            <svg viewBox="0 0 32 24" aria-hidden="true"><path d="M2 12h10" stroke="currentColor" stroke-width="5" stroke-linecap="butt"/><rect x="12" y="3" width="6" height="18" fill="none"/><path d="M18 6h12M18 10h12M18 14h12M18 18h12"/></svg>
            <span class="sr-only">Cable to Bus</span>
          </button>
          <button type="button" data-add="BUS_TO_CABLE" class="icon-button" title="Bus to Cable" aria-label="Bus to Cable">
            <svg viewBox="0 0 32 24" aria-hidden="true"><path d="M2 6h12M2 10h12M2 14h12M2 18h12"/><rect x="14" y="3" width="6" height="18" fill="none"/><path d="M20 12h10" stroke="currentColor" stroke-width="5" stroke-linecap="butt"/></svg>
            <span class="sr-only">Bus to Cable</span>
          </button>
          <button type="button" data-add="CABLE_MERGER" class="icon-button" title="Cable Merger" aria-label="Cable Merger">
            <svg viewBox="0 0 32 24" aria-hidden="true"><path d="M2 7h10M2 17h10M20 12h10" stroke="currentColor" stroke-width="5" stroke-linecap="butt"/><path d="M12 7l8 5-8 5" fill="none"/></svg>
            <span class="sr-only">Cable Merger</span>
          </button>
          <button type="button" data-add="CABLE_DIVIDER" class="icon-button" title="Cable Divider" aria-label="Cable Divider">
            <svg viewBox="0 0 32 24" aria-hidden="true"><path d="M2 12h10M20 7h10M20 17h10" stroke="currentColor" stroke-width="5" stroke-linecap="butt"/><path d="M12 12l8-5M12 12l8 5" fill="none"/></svg>
            <span class="sr-only">Cable Divider</span>
          </button>
        </div>

        <div class="toolbar-group gate-group" aria-label="Gates">
          <button type="button" data-add="BUFFER" class="icon-button" title="Buffer" aria-label="Buffer"><svg viewBox="0 0 32 24" aria-hidden="true"><path d="M5 4v16l17-8z"/><path d="M22 12h5M1 12h4"/></svg><span class="sr-only">Buffer</span></button>
          <button type="button" data-add="TRISTATE" class="icon-button" title="Tristate Buffer" aria-label="Tristate Buffer"><svg viewBox="0 0 32 24" aria-hidden="true"><path d="M5 4v16l17-8z"/><path d="M22 12h5M1 12h4M13.5 20v-4.5"/></svg><span class="sr-only">Tristate Buffer</span></button>
          <button type="button" data-add="NOT" class="icon-button" title="NOT" aria-label="NOT"><svg viewBox="0 0 32 24" aria-hidden="true"><path d="M4 4v16l15-8z"/><circle cx="23" cy="12" r="3"/><path d="M26 12h4M0 12h4"/></svg><span class="sr-only">NOT</span></button>
          <button type="button" data-add="AND" class="icon-button" title="AND" aria-label="AND"><svg viewBox="0 0 32 24" aria-hidden="true"><path d="M7 4h9a8 8 0 0 1 0 16H7z"/><path d="M1 8h6M1 16h6M24 12h7"/></svg><span class="sr-only">AND</span></button>
          <button type="button" data-add="NAND" class="icon-button" title="NAND" aria-label="NAND"><svg viewBox="0 0 34 24" aria-hidden="true"><path d="M7 4h9a8 8 0 0 1 0 16H7z"/><circle cx="27" cy="12" r="3"/><path d="M1 8h6M1 16h6M30 12h3"/></svg><span class="sr-only">NAND</span></button>
          <button type="button" data-add="OR" class="icon-button" title="OR" aria-label="OR"><svg viewBox="0 0 32 24" aria-hidden="true"><path d="M5 4c8 0 16 3 22 8-6 5-14 8-22 8 4-5 4-11 0-16z"/><path d="M1 8h7M1 16h7M27 12h4"/></svg><span class="sr-only">OR</span></button>
          <button type="button" data-add="NOR" class="icon-button" title="NOR" aria-label="NOR"><svg viewBox="0 0 34 24" aria-hidden="true"><path d="M5 4c8 0 16 3 22 8-6 5-14 8-22 8 4-5 4-11 0-16z"/><circle cx="30" cy="12" r="3"/><path d="M1 8h7M1 16h7"/></svg><span class="sr-only">NOR</span></button>
          <button type="button" data-add="XOR" class="icon-button" title="XOR" aria-label="XOR"><svg viewBox="0 0 34 24" aria-hidden="true"><path d="M8 4c8 0 16 3 22 8-6 5-14 8-22 8 4-5 4-11 0-16z"/><path d="M3 4c4 5 4 11 0 16M1 8h8M1 16h8M30 12h3"/></svg><span class="sr-only">XOR</span></button>
          <button type="button" data-add="XNOR" class="icon-button" title="XNOR" aria-label="XNOR"><svg viewBox="0 0 36 24" aria-hidden="true"><path d="M8 4c8 0 16 3 22 8-6 5-14 8-22 8 4-5 4-11 0-16z"/><path d="M3 4c4 5 4 11 0 16M1 8h8M1 16h8"/><circle cx="33" cy="12" r="3"/></svg><span class="sr-only">XNOR</span></button>
        </div>

        <div class="toolbar-group gate-group" aria-label="Sequential">
          <button type="button" data-add="SR_LATCH" class="icon-button" title="SR Latch" aria-label="SR Latch"><svg viewBox="0 0 32 24" aria-hidden="true"><rect x="8" y="3" width="16" height="18" rx="1"/><path d="M2 7h6M2 17h6M24 7h6M24 17h6"/><text x="16" y="14">SR</text></svg><span class="sr-only">SR Latch</span></button>
          <button type="button" data-add="D_LATCH" class="icon-button" title="D Latch" aria-label="D Latch"><svg viewBox="0 0 32 24" aria-hidden="true"><rect x="8" y="3" width="16" height="18" rx="1"/><path d="M2 8h6M2 16h6M24 8h6M24 16h6"/><text x="16" y="14">D</text></svg><span class="sr-only">D Latch</span></button>
          <button type="button" data-add="SR_FF" class="icon-button" title="SR Flip-Flop" aria-label="SR Flip-Flop"><svg viewBox="0 0 32 24" aria-hidden="true"><rect x="8" y="3" width="16" height="18" rx="1"/><path d="M2 7h6M2 17h6M16 21v-4M13 21l3-4 3 4M24 7h6M24 17h6"/><text x="16" y="13">SR</text></svg><span class="sr-only">SR Flip-Flop</span></button>
          <button type="button" data-add="D_FF" class="icon-button" title="D Flip-Flop" aria-label="D Flip-Flop"><svg viewBox="0 0 32 24" aria-hidden="true"><rect x="8" y="3" width="16" height="18" rx="1"/><path d="M2 8h6M16 21v-4M13 21l3-4 3 4M24 8h6M24 16h6"/><text x="16" y="13">D</text></svg><span class="sr-only">D Flip-Flop</span></button>
          <button type="button" data-add="JK_FF" class="icon-button" title="JK Flip-Flop" aria-label="JK Flip-Flop"><svg viewBox="0 0 32 24" aria-hidden="true"><rect x="8" y="3" width="16" height="18" rx="1"/><path d="M2 7h6M2 17h6M16 21v-4M13 21l3-4 3 4M24 7h6M24 17h6"/><text x="16" y="13">JK</text></svg><span class="sr-only">JK Flip-Flop</span></button>
          <button type="button" data-add="T_FF" class="icon-button" title="T Flip-Flop" aria-label="T Flip-Flop"><svg viewBox="0 0 32 24" aria-hidden="true"><rect x="8" y="3" width="16" height="18" rx="1"/><path d="M2 8h6M16 21v-4M13 21l3-4 3 4M24 8h6M24 16h6"/><text x="16" y="13">T</text></svg><span class="sr-only">T Flip-Flop</span></button>
        </div>

        <div class="toolbar-group macro-toolbar" aria-label="Macros">
          <label id="macro-drop-zone" class="import-button macro-import-zone icon-button" title="Import Macro" aria-label="Import Macro">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h6l2 3h8v9H4z"/><path d="M12 11v5M9 14h6"/></svg>
            <span class="sr-only">Import Macro</span>
            <input id="import-macro" type="file" accept="application/json,.json,.macro.json" />
          </label>
          <div id="macro-parts" class="parts-group"></div>
        </div>
      </nav>

      <main class="workspace">
        <!-- The canvas area is SVG-based so grid, wires, and gates share one coordinate system. -->
        <section class="canvas-shell">
          <div id="selection-panel" class="selection-panel">No component selected</div>
          <svg id="canvas" role="img" aria-label="Logic circuit editor canvas">
            <defs>
              <!-- Grid patterns are transformed with #viewport to stay aligned during pan/zoom. -->
              <pattern id="minor-grid" width="24" height="24" patternUnits="userSpaceOnUse">
                <path d="M 24 0 L 0 0 0 24" class="grid-minor" />
              </pattern>
              <pattern id="major-grid" width="96" height="96" patternUnits="userSpaceOnUse">
                <rect width="96" height="96" fill="url(#minor-grid)" />
                <path d="M 96 0 L 0 0 0 96" class="grid-major" />
              </pattern>
            </defs>
            <g id="viewport">
              <!-- Layer order matters: grid -> nodes/ports -> wires -> preview -> selection handles. -->
              <rect id="grid-bg" x="-32000" y="-32000" width="64000" height="64000" fill="url(#major-grid)" />
              <g id="nodes"></g>
              <g id="wires"></g>
              <g id="junction-overlay"></g>
              <g id="wire-preview"></g>
              <g id="selection-overlay"></g>
            </g>
          </svg>
          <div id="attach-label" class="attach-label" hidden>attach</div>
          <output id="status" aria-live="polite"></output>
        </section>
      </main>

      <div id="settings-modal" class="settings-modal" hidden>
        <section class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
          <header>
            <h2 id="settings-title">Settings</h2>
            <button id="settings-close" type="button" aria-label="Close settings">Close</button>
          </header>
          <label>
            Wire on
            <input id="wire-hot-color" type="color" />
          </label>
          <label>
            Wire off
            <input id="wire-cold-color" type="color" />
          </label>
          <label>
            Input switch on
            <input id="input-hot-color" type="color" />
          </label>
          <label>
            LED output on
            <input id="output-hot-color" type="color" />
          </label>
          <label>
            X signal
            <input id="x-signal-color" type="color" />
          </label>
          <label>
            Z signal
            <input id="z-signal-color" type="color" />
          </label>
          <label>
            LSB -> MSB arrow
            <input id="order-arrow-color" type="color" />
          </label>
          <label>
            Data arrow
            <input id="data-arrow-color" type="color" />
          </label>
          <label>
            LSB/MSB direction
            <select id="order-arrow-direction">
              <option value="lsb-to-msb">LSB -> MSB</option>
              <option value="msb-to-lsb">MSB -> LSB</option>
            </select>
          </label>
          <label>
            Data direction
            <select id="data-arrow-direction">
              <option value="left-to-right">Left -> Right</option>
              <option value="right-to-left">Right -> Left</option>
            </select>
          </label>
          <label>
            Arrow size
            <input id="arrow-scale" type="number" min="0.5" max="2" step="0.1" />
          </label>
          <label>
            Text
            <input id="text-default-content" type="text" />
          </label>
          <label>
            Text size
            <input id="text-default-size" type="number" min="8" max="160" step="1" />
          </label>
          <label>
            Text color
            <input id="text-default-color" type="color" />
          </label>
          <label>
            Text font
            <select id="text-default-font">
              <option value="Segoe UI, system-ui, sans-serif">Segoe UI</option>
              <option value="Arial, sans-serif">Arial</option>
              <option value="Consolas, monospace">Consolas</option>
              <option value="Times New Roman, serif">Times</option>
            </select>
          </label>
          <label>
            Text box width
            <input id="text-default-width" type="number" min="1" step="1" />
          </label>
          <label>
            Text box height
            <input id="text-default-height" type="number" min="1" step="1" />
          </label>
          <label>
            Text horizontal
            <select id="text-default-horizontal">
              <option value="left">Left</option>
              <option value="center">Center</option>
              <option value="right">Right</option>
            </select>
          </label>
          <label>
            Text vertical
            <select id="text-default-vertical">
              <option value="top">Top</option>
              <option value="middle">Middle</option>
              <option value="bottom">Bottom</option>
            </select>
          </label>
          <div class="dialog-actions">
            <button id="settings-reset" type="button">Reset Settings</button>
            <button id="settings-save" type="button">Save Settings</button>
          </div>
        </section>
      </div>
      <div id="text-modal" class="settings-modal" hidden>
        <form id="text-form" class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="text-modal-title">
          <header>
            <h2 id="text-modal-title">Text</h2>
          </header>
          <label>
            Text
            <input id="text-modal-input" type="text" autocomplete="off" />
          </label>
          <div class="dialog-actions">
            <button id="text-modal-submit" type="submit">OK</button>
            <button id="text-modal-cancel" type="button">Cancel</button>
          </div>
        </form>
      </div>
      <div id="dimension-modal" class="settings-modal" hidden>
        <form id="dimension-form" class="settings-panel dimension-panel" role="dialog" aria-modal="true" aria-labelledby="dimension-modal-title">
          <header>
            <h2 id="dimension-modal-title">Size</h2>
          </header>
          <label>
            Width
            <input id="dimension-width" type="number" min="1" step="1" autocomplete="off" />
          </label>
          <label>
            Height
            <input id="dimension-height" type="number" min="1" step="1" autocomplete="off" />
          </label>
          <div class="dialog-actions">
            <button id="dimension-submit" type="submit">OK</button>
            <button id="dimension-cancel" type="button">Cancel</button>
          </div>
        </form>
      </div>
      <div id="cable-switch-modal" class="settings-modal" hidden>
        <form id="cable-switch-form" class="settings-panel dimension-panel" role="dialog" aria-modal="true" aria-labelledby="cable-switch-title">
          <header>
            <h2 id="cable-switch-title">Cable Switch</h2>
          </header>
          <label>
            Bits
            <input id="cable-switch-bits" type="number" min="1" max="32" step="1" autocomplete="off" />
          </label>
          <label>
            Data
            <input id="cable-switch-data" type="number" min="0" step="1" autocomplete="off" />
          </label>
          <div class="dialog-actions">
            <button id="cable-switch-submit" type="submit">OK</button>
            <button id="cable-switch-cancel" type="button">Cancel</button>
          </div>
        </form>
      </div>
      <div id="template-modal" class="settings-modal" hidden>
        <section class="template-panel" role="dialog" aria-modal="true" aria-labelledby="template-title">
          <header>
            <h2 id="template-title">Template Editor</h2>
            <div class="template-actions">
              <button id="template-tool-polygon" type="button" class="icon-button template-tool-button" title="Polygon" aria-label="Polygon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6l8-3 6 6-3 9-10 1-3-7z"/><circle cx="5" cy="6" r="1.5"/><circle cx="13" cy="3" r="1.5"/><circle cx="19" cy="9" r="1.5"/><circle cx="16" cy="18" r="1.5"/><circle cx="6" cy="19" r="1.5"/><circle cx="3" cy="12" r="1.5"/></svg>
                <span class="sr-only">Polygon</span>
              </button>
              <button id="template-tool-rectangle" type="button" class="icon-button template-tool-button" title="Rectangle" aria-label="Rectangle">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="12"/></svg>
                <span class="sr-only">Rectangle</span>
              </button>
              <button id="template-tool-pin" type="button" class="icon-button template-tool-button" title="Pin" aria-label="Pin">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="8" height="8"/></svg>
                <span class="sr-only">Pin</span>
              </button>
              <button id="template-tool-multi-pin" type="button" class="icon-button template-tool-button" title="Multi Pin" aria-label="Multi Pin">
                <svg viewBox="0 0 32 24" aria-hidden="true"><rect x="3" y="8" width="5" height="5"/><rect x="11" y="8" width="5" height="5"/><rect x="19" y="8" width="5" height="5"/><rect x="27" y="8" width="5" height="5"/></svg>
                <span class="sr-only">Multi Pin</span>
              </button>
              <button id="template-tool-cable-pin" type="button" class="icon-button template-tool-button" title="Cable Pin" aria-label="Cable Pin">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="4" width="6" height="16" fill="none"/><circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/></svg>
                <span class="sr-only">Cable Pin</span>
              </button>
              <button id="template-tool-text" type="button" class="icon-button template-tool-button" title="Text" aria-label="Text">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14M12 5v14M8 19h8"/></svg>
                <span class="sr-only">Text</span>
              </button>
              <button id="template-close" type="button" class="icon-button" title="Close" aria-label="Close">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
                <span class="sr-only">Close</span>
              </button>
            </div>
          </header>
          <svg id="template-canvas" aria-label="Macro template editor"></svg>
          <output id="template-status">Click Polygon, then click points. Click the first point again to close.</output>
        </section>
      </div>
      <div id="macro-view-modal" class="settings-modal" hidden>
        <section class="macro-view-panel" role="dialog" aria-modal="true" aria-labelledby="macro-view-title">
          <header>
            <div>
              <h2 id="macro-view-title">Macro Viewer</h2>
              <p id="macro-view-status"></p>
            </div>
            <div class="template-actions">
              <button id="macro-view-back" type="button">Back</button>
              <button id="macro-view-close" type="button">Close</button>
            </div>
          </header>
          <svg id="macro-view-canvas" aria-label="Read-only macro circuit viewer"></svg>
        </section>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
